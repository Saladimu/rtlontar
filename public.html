<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-rt="titlePublic">Portal Publik - RT 017 / RW 06 Tanjung Duren Utara</title>
    <link rel="icon" type="image/png" href="rt-icon.png">
    <link rel="apple-touch-icon" href="rt-icon.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Terapkan tema sebelum render untuk mencegah kedipan (FOUC).
         Prioritas: pilihan tersimpan (localStorage) -> preferensi sistem. -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('rt_theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = saved || (prefersDark ? 'dark' : 'light');
                if (theme === 'dark') document.documentElement.classList.add('dark');
            } catch (e) { /* abaikan */ }
        })();
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
        }
        .loading-spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
    <!-- Konfigurasi identitas RT (ubah di config.js). Dimuat dengan cache-bust
         agar perubahan config.js langsung terlihat tanpa hard refresh.
         Indikator window.RT_CONFIG_READY dipakai skrip utama untuk menunggu
         config selesai dimuat (menghindari race async). -->
    <script>
        (function () {
            window.RT_CONFIG_READY = false;
            var s = document.createElement('script');
            s.src = 'config.js?v=' + Date.now();
            s.onload = function () {
                window.RT_CONFIG_READY = true;
                if (typeof window.__onConfigReady === 'function') window.__onConfigReady();
            };
            s.onerror = function () {
                window.RT_CONFIG_READY = true;
                if (typeof window.__onConfigReady === 'function') window.__onConfigReady();
            };
            document.head.appendChild(s);
        })();
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen transition-colors">

    <!-- Header -->
    <header class="bg-white dark:bg-slate-800 shadow-sm border-b border-slate-200 dark:border-slate-700">
        <div class="max-w-5xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl overflow-hidden bg-white dark:bg-slate-700 shadow-sm flex-shrink-0">
                        <img src="rt-icon.png" alt="Logo RT" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h1 class="font-bold text-lg text-slate-800 dark:text-slate-100" data-rt="headerName">RT Tanjung Duren Utara</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400" data-rt="publicSubtitle">Portal Informasi Publik - RT 017/RW 06</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="theme-toggle" onclick="toggleTheme()" title="Ganti tema terang/gelap" aria-label="Ganti tema terang/gelap"
                        class="w-9 h-9 flex items-center justify-center text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 hover:bg-blue-50 dark:hover:bg-slate-600 hover:text-blue-600 dark:hover:text-blue-300 rounded-xl transition">
                        <i id="theme-icon" class="fa-solid fa-moon"></i>
                    </button>
                    <button id="refresh-btn" onclick="refreshPublicData()" title="Muat Ulang Aplikasi (Hard Refresh)"
                        class="flex items-center space-x-2 text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 hover:bg-blue-50 dark:hover:bg-slate-600 hover:text-blue-600 dark:hover:text-blue-300 px-3 py-2 rounded-xl transition disabled:opacity-60 disabled:cursor-not-allowed">
                        <i id="refresh-icon" class="fa-solid fa-rotate-right"></i>
                        <span class="hidden sm:inline">Muat Ulang</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">

        <!-- Last Updated -->
        <div class="flex items-center justify-end">
            <div class="text-right text-xs text-slate-500 dark:text-slate-400">
                <i class="fa-regular fa-clock mr-1"></i> Terakhir diperbarui: <span id="last-update-time">-</span>
            </div>
        </div>

        <!-- ================= PENGUMUMAN ================= -->
        <section>
            <div class="flex items-center space-x-2 mb-4">
                <i class="fa-solid fa-bullhorn text-purple-600 dark:text-purple-400 text-xl"></i>
                <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100">Pengumuman</h2>
                <span id="count-pengumuman" class="ml-auto text-xs bg-purple-100 dark:bg-purple-900/40 text-purple-700 dark:text-purple-300 px-2 py-0.5 rounded-full">0</span>
            </div>

            <div id="pengumuman-container" class="space-y-3">
                <div class="flex justify-center py-12">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-slate-300 dark:text-slate-600"></i>
                </div>
            </div>
        </section>

        <!-- ================= KEGIATAN ================= -->
        <section>
            <div class="flex items-center space-x-2 mb-4">
                <i class="fa-solid fa-calendar-check text-rose-600 dark:text-rose-400 text-xl"></i>
                <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100">Agenda Kegiatan</h2>
                <span id="count-kegiatan" class="ml-auto text-xs bg-rose-100 dark:bg-rose-900/40 text-rose-700 dark:text-rose-300 px-2 py-0.5 rounded-full">0</span>
            </div>

            <div id="kegiatan-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex justify-center col-span-full py-12">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-slate-300 dark:text-slate-600"></i>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="text-center text-xs text-slate-400 dark:text-slate-500 py-4 border-t border-slate-200 dark:border-slate-700">
            <p data-rt="footerPublic">&copy; 2026 RT 017 / RW 06 Tanjung Duren Utara - Portal Publik</p>
        </footer>

    </main>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // ============================================================
        // KONFIGURASI — URL Web App diambil dari config.js (RT_CONFIG.publicApiUrl).
        // Fallback: query param ?url=... untuk kompatibilitas lama.
        // ============================================================

        // Ambil URL Web App: utamakan config.js, lalu ?url=...
        function getWebAppUrl() {
            const cfgUrl = (window.RT_CONFIG && window.RT_CONFIG.publicApiUrl)
                ? String(window.RT_CONFIG.publicApiUrl).trim()
                : '';
            if (cfgUrl) return cfgUrl;

            const params = new URLSearchParams(window.location.search);
            const urlFromParam = params.get('url');
            if (urlFromParam) return decodeURIComponent(urlFromParam);

            return '';
        }

        let WEB_APP_URL = '';

        // Versi config.js yang diharapkan (harus sama dengan RT_CONFIG.version).
        // Bila berbeda, halaman di-hard refresh sekali agar HTML & config.js sinkron.
        const EXPECTED_CONFIG_VERSION = '3';

        // Jalankan cb setelah config.js siap dibaca (hindari race async).
        function whenConfigReady(cb) {
            if (window.RT_CONFIG || window.RT_CONFIG_READY) { cb(); return; }
            window.__onConfigReady = cb;
        }

        // Buka ulang halaman dengan cache-buster (?_rtcache=<ts>) agar HTML &
        // config.js terbaru benar-benar diambil ulang (melewati cache browser).
        function hardReload() {
            try {
                const u = new URL(window.location.href);
                u.searchParams.set('_rtcache', Date.now().toString());
                window.location.replace(u.toString());
            } catch (e) {
                window.location.reload();
            }
        }

        // Gerbang versi config: bila RT_CONFIG.version berbeda dari yang diharapkan HTML ini,
        // artinya HTML lama masih ter-cache -> hard refresh sekali agar ikut diperbarui.
        // Guard sessionStorage mencegah reload berulang (bila versi memang belum disinkronkan).
        function enforceConfigVersion() {
            const v = (window.RT_CONFIG && window.RT_CONFIG.version) ? String(window.RT_CONFIG.version) : '';
            if (!v || v === EXPECTED_CONFIG_VERSION) return false;
            const key = 'rt_cfg_reload_' + v;
            let done = false;
            try { done = !!sessionStorage.getItem(key); } catch (e) { /* abaikan */ }
            if (done) {
                console.warn('Versi config berbeda (' + v + ' vs ' + EXPECTED_CONFIG_VERSION + '), reload dilewati (guard).');
                return false;
            }
            try { sessionStorage.setItem(key, '1'); } catch (e) { /* abaikan */ }
            hardReload();
            return true;
        }

        // ===== Tema terang/gelap =====
        // Kelas "dark" pada <html> mengaktifkan varian dark: Tailwind. Pilihan
        // disimpan di localStorage ('rt_theme') dan diterapkan awal di <head>
        // (lihat skrip anti-FOUC) agar tidak berkedip saat halaman dibuka.
        function currentTheme() {
            return document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        }

        function updateThemeToggleUI(isDark) {
            const icon = document.getElementById('theme-icon');
            const btn = document.getElementById('theme-toggle');
            if (icon) icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            if (btn) {
                btn.title = isDark ? 'Ganti ke mode terang' : 'Ganti ke mode gelap';
                btn.setAttribute('aria-label', btn.title);
            }
        }

        function applyTheme(theme) {
            const isDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', isDark);
            try { localStorage.setItem('rt_theme', isDark ? 'dark' : 'light'); } catch (e) { /* abaikan */ }
            updateThemeToggleUI(isDark);
        }

        function toggleTheme() {
            applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
        }

        // Bersihkan parameter cache-buster hard-refresh agar URL tetap rapi.
        (function stripCacheBuster() {
            try {
                const u = new URL(window.location.href);
                if (u.searchParams.has('_rtcache')) {
                    u.searchParams.delete('_rtcache');
                    history.replaceState(null, '', u.pathname + u.search + u.hash);
                }
            } catch (e) { /* abaikan */ }
        })();

        // Init
        document.addEventListener('DOMContentLoaded', function() {
            updateThemeToggleUI(currentTheme() === 'dark');

            whenConfigReady(function () {
                if (enforceConfigVersion()) return;
                WEB_APP_URL = getWebAppUrl();
                updateLastUpdated();

                if (WEB_APP_URL) {
                    showPublicLoading();
                    loadPublicData();
                } else {
                    showConfigNeeded();
                }
            });
        });

        // Format date: dd-Mmm-YYYY
        // RULE: Frontend only reformats strings from Apps Script. NO timezone conversion.
        function formatDateDDMMMYYYY(v) {
            if (!v) return '';
            const str = String(v);
            const parts = str.split('-');

            // Case 1: Already formatted string "yyyy-MM-dd" from Apps Script
            if (parts.length === 3 && /^\d{4}-\d{2}-\d{2}$/.test(str)) {
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
                const year = parts[0];
                const monthIndex = parseInt(parts[1]) - 1;
                const day = parts[2];
                return `${day}-${months[monthIndex]}-${year}`;
            }

            // Case 2: If it's already in dd-Mmm-YYYY format, return as-is
            if (/^\d{2}-\w{3}-\d{4}$/.test(str)) {
                return str;
            }

            // Case 3: Fallback - try to parse and return raw
            console.warn('Unexpected date format:', str);
            return str;
        }

        // Format time: HH:MM am/pm
        // RULE: Google Sheets stores times in GMT+7, Apps Script formats them correctly.
        // Frontend only reformat strings, NO timezone conversion.
        function formatTimeOnly(v) {
            if (!v) return '';

            // Case 1: Already formatted string from Apps Script ("HH:mm")
            const str = String(v);
            const timeMatch = str.match(/^(\d{2}):(\d{2})$/);
            if (timeMatch) {
                let hours = parseInt(timeMatch[1]);
                const minutes = timeMatch[2];
                const ampm = hours >= 12 ? 'pm' : 'am';
                hours = hours % 12 || 12;
                return `${hours}:${minutes} ${ampm}`;
            }

            // Case 2: Date object or ISO string - treat as UTC and convert to GMT+7
            let dateObj;
            if (v instanceof Date) {
                dateObj = v;
            } else {
                dateObj = new Date(v);
            }

            if (isNaN(dateObj.getTime())) {
                return str;
            }

            // Convert from UTC to GMT+7
            const gmt7Offset = 7 * 60; // minutes
            const utc = dateObj.getTime() + dateObj.getTimezoneOffset() * 60000;
            const gmt7Date = new Date(utc + gmt7Offset * 60000);

            let hours = gmt7Date.getHours();
            const minutes = String(gmt7Date.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'pm' : 'am';
            hours = hours % 12 || 12;
            return `${hours}:${minutes} ${ampm}`;
        }

        function updateLastUpdated() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', {
                day: 'numeric', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
            document.getElementById('last-update-time').innerText = dateStr;
        }

        // Tampilkan spinner di kedua container saat memuat data.
        function showPublicLoading() {
            document.getElementById('pengumuman-container').innerHTML =
                '<div class="flex justify-center py-12"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-slate-300 dark:text-slate-600"></i></div>';
            document.getElementById('kegiatan-container').innerHTML =
                '<div class="flex justify-center col-span-full py-12"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-slate-300 dark:text-slate-600"></i></div>';
        }

        // Tombol "Muat Ulang" = HARD REFRESH.
        // Membuka ulang halaman dengan cache-buster (?_rtcache=<ts>) agar HTML &
        // config.js terbaru benar-benar diambil ulang dari server (melewati cache
        // browser). Saat load, init menjalankan loadPublicData() kembali.
        function refreshPublicData() {
            const btn = document.getElementById('refresh-btn');
            const icon = document.getElementById('refresh-icon');
            if (btn && btn.disabled) return;

            if (btn) btn.disabled = true;
            if (icon) icon.classList.add('fa-spin');

            setTimeout(hardReload, 300);
        }

        // Apakah record boleh tampil publik. Default: tampil (kompatibel data lama).
        function isPublicVal(v) {
            if (v === true) return true;
            if (v === false || v === null || v === undefined) return true;
            const s = String(v).trim().toLowerCase();
            return !(s === 'tidak' || s === 'no' || s === 'false' || s === '0' || s === 'draft');
        }

        function loadPublicData(onComplete) {
            const callbackName = '__publicData_' + Date.now();
            const script = document.createElement('script');

            window[callbackName] = function(res) {
                delete window[callbackName];
                if (script.parentNode) script.parentNode.removeChild(script);

                if (res && res.result === 'success' && res.data) {
                    // Convert arrays to objects (same mapping as index.html)
                    const pengumuman = (res.data.Pengumuman || []).map(r => {
                        return {
                            _id: r[r.length - 1], tanggal: formatDateDDMMMYYYY(r[1]), judul: r[2], isi: r[3], kategori: r[4], pj: r[5], publik: r[6]
                        };
                    }).filter(item => isPublicVal(item.publik));
                    const kegiatan = (res.data.Kegiatan_Warga || []).map(r => {
                        return {
                            _id: r[r.length - 1], namaKegiatan: r[1], tanggal: formatDateDDMMMYYYY(r[2]), waktu: formatTimeOnly(r[3]), lokasi: r[4], pj: r[5], keterangan: r[6], publik: r[7]
                        };
                    }).filter(item => isPublicVal(item.publik));

                    renderPengumuman(pengumuman);
                    renderKegiatan(kegiatan);
                } else if (res && res.code === 'portal_disabled') {
                    showPortalDisabled();
                } else {
                    showLoadError();
                }

                if (typeof onComplete === 'function') onComplete();
            };

            script.onerror = function() {
                showLoadError();
                if (typeof onComplete === 'function') onComplete();
            };

            const sep = WEB_APP_URL.indexOf('?') === -1 ? '?' : '&';
            script.src = WEB_APP_URL + sep + 'action=readPublic&callback=' + callbackName;
            document.body.appendChild(script);
        }

        function renderPengumuman(data) {
            const container = document.getElementById('pengumuman-container');
            document.getElementById('count-pengumuman').textContent = data.length;

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700">
                        <i class="fa-solid fa-inbox text-4xl text-slate-200 dark:text-slate-600 mb-3"></i>
                        <p class="text-slate-500 dark:text-slate-400 text-sm">Belum ada pengumuman</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = data.map((item, i) => `
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-purple-300 dark:hover:border-purple-500 transition">
                    <div class="flex items-start justify-between mb-2">
                        <span class="text-xs px-2 py-0.5 rounded-full ${getKategoriBadge(item.kategori)}">
                            ${item.kategori}
                        </span>
                        <span class="text-xs text-slate-400 dark:text-slate-500">${item.tanggal}</span>
                    </div>
                    <h3 class="font-bold text-slate-800 dark:text-slate-100 text-sm mb-2">${item.judul}</h3>
                    <p class="text-xs text-slate-600 dark:text-slate-300 whitespace-pre-line">${item.isi}</p>
                    <div class="mt-2 text-[10px] text-slate-400 dark:text-slate-500">
                        <i class="fa-regular fa-user mr-1"></i>${item.pj}
                    </div>
                </div>
            `).reverse().join('');
        }

        function renderKegiatan(data) {
            const container = document.getElementById('kegiatan-container');
            document.getElementById('count-kegiatan').textContent = data.length;

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700">
                        <i class="fa-solid fa-calendar-xmark text-4xl text-slate-200 dark:text-slate-600 mb-3"></i>
                        <p class="text-slate-500 dark:text-slate-400 text-sm">Belum ada agenda kegiatan</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-rose-300 dark:hover:border-rose-500 transition">
                    <div class="flex items-start justify-between mb-2">
                        <h3 class="font-bold text-slate-800 dark:text-slate-100 text-sm">${item.namaKegiatan}</h3>
                        <span class="text-xs px-2 py-0.5 bg-rose-50 dark:bg-rose-900/40 text-rose-600 dark:text-rose-300 rounded-lg">
                            <i class="fa-regular fa-clock mr-1"></i>${formatTimeOnly(item.waktu)}
                        </span>
                    </div>
                    <div class="space-y-1 text-xs text-slate-600 dark:text-slate-300">
                        <p><i class="fa-regular fa-calendar w-4 text-slate-400 dark:text-slate-500"></i> ${item.tanggal}</p>
                        <p><i class="fa-solid fa-location-dot w-4 text-slate-400 dark:text-slate-500"></i> ${item.lokasi}</p>
                        <p><i class="fa-solid fa-user-gear w-4 text-slate-400 dark:text-slate-500"></i> PJ: ${item.pj}</p>
                    </div>
                    ${item.keterangan ? `<p class="mt-2 text-[11px] text-slate-500 dark:text-slate-400 italic bg-slate-50 dark:bg-slate-700/50 p-2 rounded">"${item.keterangan}"</p>` : ''}
                </div>
            `).join('');
        }

        function getKategoriBadge(kategori) {
            const map = {
                'Informasi Umum': 'bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300',
                'Penting/Mendesak': 'bg-rose-100 dark:bg-rose-900/40 text-rose-700 dark:text-rose-300',
                'Keuangan': 'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300',
                'Kegiatan': 'bg-purple-100 dark:bg-purple-900/40 text-purple-700 dark:text-purple-300'
            };
            return map[kategori] || 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300';
        }

        function showPortalDisabled() {
            const html = `
                <div class="bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-700 rounded-2xl p-6 text-center">
                    <i class="fa-solid fa-lock text-4xl text-amber-400 mb-3"></i>
                    <h3 class="font-bold text-amber-900 dark:text-amber-200 text-lg mb-2">Portal publik dinonaktifkan</h3>
                    <p class="text-sm text-amber-700 dark:text-amber-300">Admin RT sedang menonaktifkan akses portal publik. Silakan coba lagi nanti.</p>
                </div>
            `;
            document.getElementById('pengumuman-container').innerHTML = html;
            document.getElementById('kegiatan-container').innerHTML = '';
            document.getElementById('count-pengumuman').textContent = '-';
            document.getElementById('count-kegiatan').textContent = '-';
        }

        function showLoadError() {
            const html = `
                <div class="bg-rose-50 dark:bg-rose-900/30 border border-rose-200 dark:border-rose-700 rounded-2xl p-6 text-center">
                    <i class="fa-solid fa-triangle-exclamation text-4xl text-rose-400 mb-3"></i>
                    <h3 class="font-bold text-rose-900 dark:text-rose-200 text-lg mb-2">Gagal memuat data</h3>
                    <p class="text-sm text-rose-700 dark:text-rose-300">Periksa koneksi internet lalu tekan tombol "Muat Ulang".</p>
                </div>
            `;
            document.getElementById('pengumuman-container').innerHTML = html;
            document.getElementById('kegiatan-container').innerHTML = '';
            document.getElementById('count-pengumuman').textContent = '-';
            document.getElementById('count-kegiatan').textContent = '-';
        }

        function showConfigNeeded() {
            const html = `
                <div class="bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-700 rounded-2xl p-6 text-center">
                    <i class="fa-solid fa-gear text-4xl text-amber-400 mb-3"></i>
                    <h3 class="font-bold text-amber-900 dark:text-amber-200 text-lg mb-2">Konfigurasi diperlukan</h3>
                    <p class="text-sm text-amber-700 dark:text-amber-300 mb-4">
                        Halaman publik membutuhkan URL Google Apps Script agar dapat menampilkan data.<br>
                        Isi <b>publicApiUrl</b> pada <b>config.js</b> dengan URL Web App (berakhiran /exec),
                        atau hubungi admin.
                    </p>
                    <p class="text-xs text-amber-600 dark:text-amber-300 font-mono bg-amber-100 dark:bg-amber-900/50 p-2 rounded">
                        config.js &rarr; RT_CONFIG.publicApiUrl: 'https://script.google.com/macros/s/xxxx/exec'
                    </p>
                </div>
            `;
            document.getElementById('pengumuman-container').innerHTML = html;
            document.getElementById('kegiatan-container').innerHTML = '';
            document.getElementById('count-pengumuman').textContent = '-';
            document.getElementById('count-kegiatan').textContent = '-';
        }
    </script>
